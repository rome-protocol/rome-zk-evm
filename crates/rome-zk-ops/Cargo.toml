[package]
name = "rome-zk-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The operator CLI: one binary for the settlement commands (chain-id, register, refund-deposit, exit-config, migrate, init-cursor) and the bridge commands (vault init, vault fund, vault show, release-exit). Every transaction goes out as a V1 transaction through rome-zk-solana-sender."

[lib]
name = "rome_zk_ops"
path = "src/lib.rs"

[[bin]]
name = "rome-zk-ops"
path = "src/main.rs"

[dependencies]
# Instruction builders, PDA derivation and account decoders. Library only, no RPC client, no feature.
zk-settlement-client = { path = "../zk-settlement-client" }
zk-inbox-client = { path = "../zk-inbox-client" }
# The vault tool's planning code and the bridge instruction builders. Library only, no feature.
zk-bridge-client = { path = "../zk-bridge-client" }
rome-zk-layouts = { path = "../rome-zk-layouts" }
# Every transaction this CLI sends goes through this crate, as a V1 transaction. There is no other send path.
rome-zk-solana-sender = { path = "../rome-zk-solana-sender" }
solana-program.workspace = true
solana-keypair.workspace = true
solana-signer.workspace = true
solana-hash.workspace = true
solana-client.workspace = true
solana-commitment-config.workspace = true
wincode.workspace = true
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
thiserror = "2"
hex = "0.4"
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
# The program's own account writers, so the bridge command tests build the bytes the program writes.
zk-bridge = { path = "../../programs/zk-bridge", features = ["no-entrypoint"] }

[lints]
workspace = true
