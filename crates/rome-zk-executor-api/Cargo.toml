[package]
name = "rome-zk-executor-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The Executor trait, factored out of rome-zk-sequencer so an implementation crate (rome-zk-executor-reth) can depend on the trait without a rome-zk-sequencer <-> rome-zk-executor-reth cycle. Re-exported at rome_zk_sequencer::executor — not a new public surface."

[dependencies]
alloy-primitives = { version = "1.6", default-features = false, features = ["std"] }
# The withdrawals rule: `Withdrawal` (alloy-eips) and the ordered-trie root (alloy-trie), the same pair of crates the
# guest's execution layer already resolves, so one function serves the sequencer, derive and the guest.
alloy-eips = { version = "2.0", default-features = false }
alloy-trie = { version = "0.9", default-features = false }
thiserror = "2"

[dev-dependencies]
# Cross-check only: the root this crate computes must equal alloy-consensus' own `calculate_withdrawals_root`.
alloy-consensus = { version = "2", default-features = false }

[lints]
workspace = true
