[package]
name = "rome-zk-profile"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "chain cadence/cap profile, persisted profile.json identity, and the file layer that reads and writes it — no Solana, reth, alloy or tokio dependency"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
toml = "1"

[lints]
workspace = true
