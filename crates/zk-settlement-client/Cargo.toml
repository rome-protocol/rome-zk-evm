[package]
name = "zk-settlement-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# Thin, async-runtime-agnostic client for programs/zk-settlement: instruction builders, PDA derivation,
# and account decoding for the root, pending and registry accounts. The batch poster and the
# zk-inbox chunk `Close` path use this (not zk_settlement's own instruction structs directly) so they
# never depend on the program crate's `no-entrypoint` feature.

[dependencies]
borsh = { version = "1.5.1", features = ["derive"] }
solana-program.workspace = true
solana-system-interface = { workspace = true, features = ["bincode"] }
solana-loader-v3-interface.workspace = true
zk-settlement = { path = "../../programs/zk-settlement", features = ["no-entrypoint"] }
rome-zk-layouts = { path = "../rome-zk-layouts" }
rome-zk-merkle = { path = "../rome-zk-merkle" }
rome-zk-mpt = { path = "../rome-zk-mpt" }
thiserror = "1"

[features]
# Pulls in a Solana RPC client + Tokio for the devnet example binary; off by default so plain library
# consumers (program tests, other clients) never need an async runtime transitively.
devnet-driver = [
  "dep:solana-client",
  "dep:solana-sdk",
  "dep:solana-commitment-config",
  "dep:solana-transaction-status-client-types",
  "dep:tokio",
  "dep:zk-inbox-client",
  "dep:hex",
  "dep:serde_json",
  "dep:reqwest",
  "dep:base64",
  "dep:bincode",
]

[dependencies.solana-client]
workspace = true
optional = true

[dependencies.solana-sdk]
workspace = true
optional = true

[dependencies.solana-commitment-config]
workspace = true
optional = true

[dependencies.solana-transaction-status-client-types]
workspace = true
optional = true

[dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread"]
optional = true

[dependencies.zk-inbox-client]
path = "../zk-inbox-client"
optional = true

[dependencies.hex]
version = "0.4"
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls"]
optional = true

# `governance.rs`'s `--dry-run`: base64-encodes the bincode-serialized `Transaction` — the same wire
# encoding a real `sendTransaction` RPC call receives — so a dry-run tx is inspectable without ever
# touching a cluster.
[dependencies.base64]
version = "0.22"
optional = true

[dependencies.bincode]
version = "1"
optional = true

[[example]]
name = "devnet_driver"
required-features = ["devnet-driver"]

[[example]]
name = "register_chain"
required-features = ["devnet-driver"]

[[example]]
name = "migrate_chain"
required-features = ["devnet-driver"]

[[example]]
name = "governance"
required-features = ["devnet-driver"]

[lints]
workspace = true
