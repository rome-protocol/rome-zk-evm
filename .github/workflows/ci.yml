name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cd crates/rome-zk-prover-input && cargo fmt --all --check
      - run: cd crates/rome-zk-prover && cargo fmt --all --check
      - name: Cargo.lock is current
        run: cargo metadata --locked --format-version 1 > /dev/null
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cd crates/rome-zk-prover-input && cargo clippy --locked --all-targets -- -D warnings
      - run: cd crates/rome-zk-prover && cargo clippy --locked --all-targets -- -D warnings
  test:
    # Some tests load the programs as built: they come from build-sbf, so the test job never builds them twice.
    needs: build-sbf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@v7
        with:
          name: programs
          path: target/deploy
      - uses: actions/download-artifact@v7
        with:
          name: test-programs
          path: target/deploy
      - run: cargo test --workspace
      - run: cd crates/rome-zk-prover-input && cargo test --locked
      - run: cd crates/rome-zk-prover && cargo test --locked
  build-sbf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Install the Solana tools
        run: |
          # Pinned to the release the published programs are built with (cargo-build-sbf 4.1.0, platform-tools
          # v1.54), so a build here matches the deployed bytes and the compute-unit tests.
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.1.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: cargo build-sbf --version
      - name: Platform-tools supports --arch v3
        run: ./scripts/check-platform-tools.sh
      - name: Build every program as SBPF v3
        run: |
          set -e
          for p in programs/*/; do cargo build-sbf --manifest-path "$p/Cargo.toml" --sbf-out-dir target/deploy --arch v3; done
          ./scripts/check-sbpf-v3.sh target/deploy/zk_inbox.so target/deploy/zk_settlement.so target/deploy/veritas.so target/deploy/zk_bridge.so
      - uses: actions/upload-artifact@v7
        with:
          name: programs
          path: target/deploy/*.so
          if-no-files-found: error
      # The programs the tests load besides Rome's own. They go in a separate artifact, so the programs artifact above
      # holds only what is deployed.
      - name: Test-only and third-party programs
        run: |
          set -e
          out=target/test-deploy
          # A test-only stub bridge that the zk-settlement exit tests load as a second program. It is never deployed.
          cargo build-sbf --manifest-path programs/zk-settlement/tests/fixtures/stub-bridge/Cargo.toml --sbf-out-dir "$out" --arch v3
          ./scripts/check-sbpf-v3.sh "$out/zk_exit_stub_bridge.so"
          # SPL Token, built from the pinned spl-token 9.0.0 crate's own source. spl-token is not a dependency of this
          # workspace, so a throwaway manifest in a temp dir fetches it.
          tmp=$(mktemp -d)
          mkdir -p "$tmp/src" && echo '' > "$tmp/src/lib.rs"
          printf '[package]\nname = "spl-token-fetch"\nversion = "0.0.0"\nedition = "2021"\npublish = false\n[dependencies]\nspl-token = "=9.0.0"\n' > "$tmp/Cargo.toml"
          manifest=$(cd "$tmp" && cargo metadata --format-version=1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["manifest_path"] for p in d["packages"] if p["name"]=="spl-token" and p["version"]=="9.0.0"))')
          cargo build-sbf --manifest-path "$manifest" --sbf-out-dir "$out"
          rm -rf "$tmp"
          # The Associated Token Account program does not build from a fresh source resolve, so it is copied from
          # devnet and checked against a pinned hash: a silent redeploy fails here instead of changing the tests.
          for try in 1 2 3; do
            solana program dump ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL "$out/spl_associated_token_account.so" --url https://api.devnet.solana.com && break
            [ "$try" = 3 ] && exit 1
            sleep 10
          done
          echo "6804554e69fd3a58caa191dc4a58f4c67223d30ca28ab8987f39fc18d2f7374d  $out/spl_associated_token_account.so" | sha256sum --check
      - uses: actions/upload-artifact@v7
        with:
          name: test-programs
          path: target/test-deploy/*.so
          if-no-files-found: error
  rollup-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run every shell test under deploy/rollup/tests
        run: |
          set -euo pipefail
          if [ ! -d deploy/rollup/tests ]; then
            echo "deploy/rollup/tests does not exist yet; nothing to run"
            exit 0
          fi
          ls deploy/rollup/tests/*.sh >/dev/null
          status=0
          for t in deploy/rollup/tests/*.sh; do
            echo "::group::$t"
            if bash "$t"; then echo "PASS $t"; else echo "FAIL $t"; status=1; fi
            echo "::endgroup::"
          done
          exit "$status"
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - run: semgrep scan --config p/rust --config p/trailofbits
