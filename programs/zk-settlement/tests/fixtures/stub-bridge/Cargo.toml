[workspace]
# Deliberately its own single-crate workspace (not a member of the root workspace's "programs/*" glob —
# this directory is two levels deeper than that glob reaches, and this `[workspace]` table stops Cargo
# from ever inferring it belongs to the root workspace by accident). A TEST-ONLY stand-in for
# the real bridge program (`programs/zk-bridge`) — it exists solely so `programs/zk-settlement`'s
# real-BPF `ConsumeExit` tests can exercise a genuine CPI-signed `exit_consumer` PDA the same way
# `programs/zk-inbox` is loaded as a real second program in `tests/settlement.rs` (this program is never
# deployed anywhere real, and is never picked up by `programs/*/`'s build-sbf loop or by the release-artifact
# upload; its one `.so` is built by explicit manifest path, alongside, never instead of, the real programs).

[package]
name = "zk-exit-stub-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
default = []

[dependencies]
solana-program = "=2.1.6"

# solana_program::entrypoint! emits cfgs the host compiler does not know; declare them once (standard Anza
# advice, matching the root workspace's own `[workspace.lints.rust]` — this crate has no workspace to
# inherit that from, being its own standalone `[workspace]`, so it is repeated here).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("custom-heap", "custom-panic", "frozen-abi", "no-entrypoint"))',
] }
